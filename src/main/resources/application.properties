spring.application.name=ecommerce
server.port=${SERVER_PORT:8180}

# Honour X-Forwarded-Proto/Host when running behind a TLS-terminating proxy (ngrok, nginx),
# so generated URLs (springdoc servers, redirects) keep the https scheme.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# data.sql seeds demo rows; it needs the schema to exist first.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.platform=mysql
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
# Redis is used for caching only; repository scanning would otherwise try to claim the JPA repositories.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# Security / JWT
# ---------------------------------------------------------------------------
# Must be at least 32 bytes. Generate with: openssl rand -base64 48
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Comma separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost,http://149.130.210.119,https://149.130.210.119, https://unalimentary-emilie-flamboyantly.ngrok-free.dev}

# ---------------------------------------------------------------------------
# RustFS object storage (S3 compatible)
# ---------------------------------------------------------------------------
storage.endpoint=${RUSTFS_ENDPOINT:http://localhost:9000}
storage.region=${RUSTFS_REGION:us-east-1}
storage.access-key=${RUSTFS_ACCESS_KEY:rustfsadmin}
storage.secret-key=${RUSTFS_SECRET_KEY:rustfsadmin}
storage.bucket=${RUSTFS_BUCKET:ecommerce}
# Set when RustFS is reachable from the browser under a different host than from the app.
storage.public-url=${RUSTFS_PUBLIC_URL:}
storage.path-style-access=true
storage.auto-create-bucket=true
storage.max-file-size=${RUSTFS_MAX_FILE_SIZE:5242880}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

# ---------------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:no-reply@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# ---------------------------------------------------------------------------
# Stripe
# ---------------------------------------------------------------------------
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/api/payments/checkout/success?session_id={CHECKOUT_SESSION_ID}}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/api/payments/checkout/cancel}

# ---------------------------------------------------------------------------
# Docs & actuator
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.dev.abhishek.ecommerce=${LOG_LEVEL:INFO}
