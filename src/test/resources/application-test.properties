spring.datasource.url=jdbc:h2:mem:ecommerce-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.app.jwtSecret=test-secret-for-context-loads-only-that-is-long-enough
spring.app.jwtExpirationMs=3600000

app.cors.allowed-origins=http://localhost:3000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test

# RustFS is not reachable in tests; bucket verification degrades to a warning.
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.access-key=test-access-key
storage.secret-key=test-secret-key
storage.bucket=test-bucket
storage.auto-create-bucket=false

stripe.secret.key=
